<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skunky | Platform Assistant Preview</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#080e18;color:#ecf2fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem}
main{width:min(100%,740px);border:1px solid #2b3b4b;border-radius:1.1rem;background:#101a29;overflow:hidden}
header{padding:1.25rem 1.5rem;border-bottom:1px solid #2b3b4b}
h1{margin:0;font-size:1.4rem}p{color:#b8c8d8;line-height:1.6}
#log{min-height:20rem;max-height:55vh;overflow:auto;padding:1.25rem;display:grid;align-content:start;gap:.9rem}
.msg{padding:.8rem 1rem;border:1px solid #2b3b4b;border-radius:.8rem;max-width:88%;white-space:pre-wrap}
.user{justify-self:end;background:#12344a}.bot{justify-self:start;background:#182334}
form{display:flex;gap:.6rem;padding:1rem;border-top:1px solid #2b3b4b}
input{min-width:0;flex:1;background:#090f1c;border:1px solid #526478;color:white;border-radius:.6rem;padding:.8rem}
button{border:0;border-radius:.6rem;padding:.8rem 1rem;background:#8ce1f1;color:#05101b;font-weight:700;cursor:pointer}
footer{padding:0 1rem 1rem;font-size:.8rem;color:#b8c8d8}
a{color:#93e4f4}
</style>
</head>
<body>
<main>
<header><h1>Skunky · Platform assistant</h1><p>Rule-based development preview. No generative AI is connected, and no messages are sent to a server.</p></header>
<div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
<form id="form"><input id="message" required maxlength="400" aria-label="Ask about Skunky" placeholder="Try: search, scan, collect, API, privacy, help" /><button type="submit">Send</button></form>
<footer>For source extraction use the <a href="https://skunkscrape.com/pipeline">authenticated development preview</a> when enabled. Never enter credentials or personal lead data here.</footer>
</main>
<script>
const rules=[
  [/\b(search|discover|sources?)\b/i,"Search queries a reviewed source registry; it does not search the open web. Service: skunky-bot/search."],
  [/\b(scan|extract|crawl)\b/i,"Scan currently extracts contact candidates from bounded HTML supplied by an authorized caller. It does not crawl websites. Service: skunky-bot/scan."],
  [/\b(collect|normalize|ingest|dedup)\b/i,"Collect validates and deduplicates contact candidates. This preview does not store data or authorize outreach. Service: skunky-bot/collect."],
  [/\b(api|backend|authentication)\b/i,"The FastAPI control plane owns JWT authentication and the /pipeline/preview contract. Service: skunky-bot/api."],
  [/\b(privacy|popia|consent|compliance)\b/i,"Consent is unverified in previews. No outreach, exports, persistence or unrestricted scraping are enabled."],
  [/\b(help|hello|hi|start)\b/i,"Ask about search, scan, collect, API, privacy, or the Skunky platform architecture."]
];
const log=document.querySelector("#log");
function append(kind,value){const row=document.createElement("div");row.className="msg "+kind;row.textContent=value;log.append(row);log.scrollTop=log.scrollHeight;}
append("bot","Welcome. I can explain the development-stage platform services.");
document.querySelector("#form").addEventListener("submit",e=>{
 e.preventDefault();const input=document.querySelector("#message");const q=input.value.trim();if(!q)return;
 append("user",q);const match=rules.find(r=>r[0].test(q));append("bot",match?match[1]:"I only support documented Skunky platform topics at present. Type 'help' for options.");
 input.value="";input.focus();
});
</script>
</body>
</html>
